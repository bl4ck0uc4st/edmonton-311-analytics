name: Refresh data

# Pulls the live 311 dataset from data.edmonton.ca, rebuilds the warehouse, runs the
# data-quality gate and publishes the exported star schema as assets of the rolling
# "data-latest" GitHub Release. Power BI refreshes straight from those assets.
#
#   * Mondays 05:17 Edmonton time (11:17 UTC): incremental refresh (re-extract the last 3 months)
#   * 1st of every month 06:17 Edmonton time: full refresh (every month in the rolling 3-year window)
#   * Manual: Actions > Refresh data > Run workflow (choose the mode)

on:
  schedule:
    - cron: "17 11 * * 1"
    - cron: "17 12 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Extraction mode"
        type: choice
        options: [incremental, full]
        default: incremental

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      YEG311_PAGE_SIZE: "50000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Restore previous raw partitions (enables incremental mode)
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-311-${{ github.run_id }}
          restore-keys: |
            raw-311-

      - name: Decide extraction mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "17 12 1 * *" ]; then MODE=full; else MODE=incremental; fi
          fi
          if [ ! -f data/raw/311_requests/_manifest.json ]; then
            echo "No cached partitions found: forcing a full extraction"
            MODE=full
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Extraction mode: $MODE"

      - name: Extract from data.edmonton.ca
        run: yeg311 extract --mode ${{ steps.mode.outputs.mode }}

      - name: Save raw partitions for the next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/raw
          key: raw-311-${{ github.run_id }}

      - name: Build warehouse
        run: yeg311 build

      - name: Data-quality gate
        run: yeg311 quality

      - name: Export star schema
        run: |
          yeg311 export
          yeg311 stats | tee data/exports/headline_stats.txt
          cp data/warehouse/quality_report.json data/exports/quality_report.json
          ls -la data/exports

      - name: Render preview charts and latest numbers
        run: |
          yeg311 charts --out docs/img/charts
          mkdir -p data/exports/charts && cp docs/img/charts/*.png data/exports/charts/
          {
            echo "# Latest numbers"
            echo
            echo "Generated by the scheduled refresh workflow from the live dataset (mode: ${{ steps.mode.outputs.mode }}). Updated weekly."
            echo
            echo '```'
            cat data/exports/headline_stats.txt
            echo '```'
          } > docs/latest_stats.md

      - name: Commit refreshed charts and numbers (authored by the repository owner)
        run: |
          git config user.name "Vraj Patel"
          git config user.email "34685771+bl4ck0uc4st@users.noreply.github.com"
          git add docs/img/charts docs/latest_stats.md
          if git diff --cached --quiet; then
            echo "Charts and numbers unchanged; nothing to commit"
          else
            git commit -m "Refresh preview charts and latest numbers from live 311 data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload exports as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: exports-${{ github.run_id }}
          path: data/exports
          retention-days: 30

      - name: Publish to the rolling "data-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILT=$(python -c "import json;print(json.load(open('data/exports/metadata.json'))['build']['built_at_utc'])")
          ROWS=$(python -c "import json;print(json.load(open('data/exports/metadata.json'))['build']['rows.gold.fact_service_request'])")
          NOTES="Latest star-schema exports built ${BUILT} from https://data.edmonton.ca/d/q7ua-agfg (fact rows: ${ROWS}). Mode: ${{ steps.mode.outputs.mode }}. Power BI reads these files directly; see powerbi/README.md."
          if gh release view data-latest >/dev/null 2>&1; then
            gh release edit data-latest --title "Latest data exports" --notes "$NOTES"
          else
            gh release create data-latest --title "Latest data exports" --notes "$NOTES" --latest=false
          fi
          gh release upload data-latest data/exports/*.parquet data/exports/*.csv data/exports/*.json data/exports/*.txt data/exports/charts/*.png --clobber

      - name: Job summary
        run: |
          {
            echo "## Refresh summary (${{ steps.mode.outputs.mode }})"
            echo
            echo '```'
            cat data/exports/headline_stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
